# Example deployment for the Backlogfit self-hosted server (Docker Compose or podman-compose).
# Build first from the repository root:
#   podman build --format docker --ignorefile apps/server/.containerignore \
#     -f apps/server/Containerfile -t backlogfit:latest .
# Put a TLS-terminating reverse proxy in front and set PUBLIC_ORIGIN to its https origin.
services:
  backlogfit:
    image: localhost/backlogfit:latest
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - backlogfit-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PUBLIC_ORIGIN: https://estimate.example.com
      # TRUST_PROXY: "true"            # only behind a proxy that sets X-Forwarded-For
      # ALLOWED_ORIGINS: ""            # extra exact origins, comma separated
      # MAX_LIFETIME_HOURS: "8"
      # IDLE_TIMEOUT_MINUTES: "30"
      # MAX_ROOMS: "1000"
      # ROOM_CREATE_PER_MIN: "10"
    stop_signal: SIGTERM
    stop_grace_period: 10s
    mem_limit: 256m
    pids_limit: 128

volumes:
  backlogfit-data:
