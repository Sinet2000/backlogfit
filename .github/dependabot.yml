version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: build
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /apps/server
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      container-images:
        patterns: ['*']
