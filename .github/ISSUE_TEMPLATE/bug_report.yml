name: Bug report
description: Something does not work as expected.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Security issue?** Do not file it here; use [private vulnerability reporting](https://github.com/Sinet2000/backlogfit/security/advisories/new).
        **Never paste room links**: they contain secrets.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a room with the T-shirt deck
        2. Join as a spectator
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Where do you run Backlogfit?
      options:
        - backlogfit.com
        - Self-hosted container (Podman/Docker)
        - Self-hosted Cloudflare Worker
        - Local development
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 140 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Relevant console output or server logs
      description: Remove any room IDs, secrets or personal data first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This report contains no room links, secrets or personal data.
          required: true
